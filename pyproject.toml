[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "like-bach-engine"
version = "5.1.0"
description = "Baroque counterpoint and fugue generation engine with NWC 2.75 User Tool integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hyunchan An", email = "hyunchan.an@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "music21>=9.0.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "safetensors>=0.4.3",
    "huggingface_hub>=0.23.0",
    "onnxruntime>=1.18.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
macos-mlx = [
    "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.setuptools]
packages = ["src", "tests"]

[tool.ruff]
exclude = [
    "src/v3",
    "src/v4",
    "scratch",
]

[tool.ruff.lint]
ignore = ["E402", "F401", "E701", "F841"]
