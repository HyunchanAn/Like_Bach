name: Like Bach CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install dependencies (Bypassing macOS-only MLX)
      run: |
        python -m pip install --upgrade pip
        # Exclude mlx and mlx-lm which are macOS-only
        grep -v -E "mlx|mlx-lm" requirements.txt > temp_requirements.txt
        pip install -r temp_requirements.txt
        pip install pytest ruff

    - name: Lint and Format Check with Ruff
      run: |
        ruff check .

    - name: Run Backend Unit Tests
      run: |
        pytest

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: "npm"
        cache-dependency-path: ui/v4-app/package-lock.json

    - name: Install frontend dependencies
      working-directory: ui/v4-app
      run: npm ci

    - name: Lint frontend code
      working-directory: ui/v4-app
      run: npm run lint

    - name: Test frontend production build
      working-directory: ui/v4-app
      run: npm run build
